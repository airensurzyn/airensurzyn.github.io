<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Globe -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <!-- Latitude arc (mid) -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="#93c5fd" stroke-width="0.9" opacity="0.8"/>
  <!-- Meridians -->
  <path d="M16 2 Q23 9 23 16 Q23 23 16 30" fill="none" stroke="#93c5fd" stroke-width="0.9" opacity="0.8"/>
  <path d="M16 2 Q9 9 9 16 Q9 23 16 30" fill="none" stroke="#93c5fd" stroke-width="0.9" opacity="0.8"/>
  <!-- Equator -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#93c5fd" stroke-width="0.9" opacity="0.8"/>

  <!-- Robot head (centered on globe) -->
  <rect x="9.5" y="11" width="13" height="11" rx="2.5" fill="#dbeafe" stroke="#2563eb" stroke-width="0.8"/>
  <!-- Eyes -->
  <rect x="11.5" y="13" width="3.5" height="3.5" rx="1" fill="#1d4ed8"/>
  <rect x="17" y="13" width="3.5" height="3.5" rx="1" fill="#1d4ed8"/>
  <!-- Eye glow -->
  <rect x="12.2" y="13.7" width="1.2" height="1.2" rx="0.3" fill="#93c5fd"/>
  <rect x="17.7" y="13.7" width="1.2" height="1.2" rx="0.3" fill="#93c5fd"/>
  <!-- Mouth -->
  <rect x="12" y="18" width="8" height="2" rx="1" fill="#2563eb" opacity="0.8"/>

  <!-- Antenna -->
  <line x1="16" y1="11" x2="16" y2="7.5" stroke="#1e3a8a" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="16" cy="6.5" r="2" fill="#60a5fa" stroke="#1e3a8a" stroke-width="0.6"/>
</svg>
