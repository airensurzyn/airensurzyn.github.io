<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="globe-clip">
      <circle cx="16" cy="16" r="12.5"/>
    </clipPath>
  </defs>

  <!-- Globe fill -->
  <circle cx="16" cy="16" r="13" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Grid lines clipped inside globe -->
  <g clip-path="url(#globe-clip)" stroke="#000000" fill="none">
    <!-- Latitude lines -->
    <line x1="3" y1="10.5" x2="29" y2="10.5" stroke-width="1"/>
    <line x1="3" y1="16"   x2="29" y2="16"   stroke-width="1.2"/>
    <line x1="3" y1="21.5" x2="29" y2="21.5" stroke-width="1"/>

    <!-- Meridians (curved to give 3D feel) -->
    <path d="M16 3 Q10 16 16 29" stroke-width="1"/>
    <path d="M16 3 Q22 16 16 29" stroke-width="1"/>
    <path d="M16 3 Q4  16 16 29" stroke-width="1"/>
    <path d="M16 3 Q28 16 16 29" stroke-width="1"/>
  </g>
</svg>
